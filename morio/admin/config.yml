backend:
  name: git-gateway
  branch: main

media_folder: "morio/assets/img"
public_folder: "assets/img"

locale: ja

collections:
  - name: "pages"
    label: "ページ管理"
    files:

      - name: "home"
        label: "ホーム（トップページ）"
        file: "morio/data/home.json"
        format: json
        fields:
          - { label: "ヒーロー タグライン", name: "hero_tag", widget: "string" }
          - { label: "ヒーロー 見出し", name: "hero_h1", widget: "text", hint: "⚠️ HTMLタグを含みます。例：改行＝<br>。タグは削除・変更しないでください。" }
          - { label: "ステートメント 本文", name: "statement_text", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション01 本文", name: "s1_lead", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション02 本文", name: "s2_body", widget: "text" }
          - { label: "ケイパビリティ01 英語名", name: "cap1_en", widget: "string" }
          - { label: "ケイパビリティ01 日本語名", name: "cap1_jp", widget: "string" }
          - { label: "ケイパビリティ01 説明", name: "cap1_desc", widget: "text" }
          - { label: "ケイパビリティ02 英語名", name: "cap2_en", widget: "string" }
          - { label: "ケイパビリティ02 日本語名", name: "cap2_jp", widget: "string" }
          - { label: "ケイパビリティ02 説明", name: "cap2_desc", widget: "text" }
          - { label: "ケイパビリティ03 英語名", name: "cap3_en", widget: "string" }
          - { label: "ケイパビリティ03 日本語名", name: "cap3_jp", widget: "string" }
          - { label: "ケイパビリティ03 説明", name: "cap3_desc", widget: "text" }
          - { label: "ケイパビリティ04 英語名", name: "cap4_en", widget: "string" }
          - { label: "ケイパビリティ04 日本語名", name: "cap4_jp", widget: "string" }
          - { label: "ケイパビリティ04 説明", name: "cap4_desc", widget: "text" }
          - { label: "ケイパビリティ05 英語名", name: "cap5_en", widget: "string" }
          - { label: "ケイパビリティ05 日本語名", name: "cap5_jp", widget: "string" }
          - { label: "ケイパビリティ05 説明", name: "cap5_desc", widget: "text" }
          - { label: "ケイパビリティ06 英語名", name: "cap6_en", widget: "string" }
          - { label: "ケイパビリティ06 日本語名", name: "cap6_jp", widget: "string" }
          - { label: "ケイパビリティ06 説明", name: "cap6_desc", widget: "text" }
          - { label: "実績01 数値（HTML可）", name: "stat1_n", widget: "string", hint: "例: 65,000<span class=\"u\">円/坪</span>" }
          - { label: "実績01 ラベル", name: "stat1_k", widget: "string" }
          - { label: "実績01 説明", name: "stat1_d", widget: "text" }
          - { label: "実績02 数値（HTML可）", name: "stat2_n", widget: "string" }
          - { label: "実績02 ラベル", name: "stat2_k", widget: "string" }
          - { label: "実績02 説明", name: "stat2_d", widget: "text" }
          - { label: "実績03 数値（HTML可）", name: "stat3_n", widget: "string" }
          - { label: "実績03 ラベル", name: "stat3_k", widget: "string" }
          - { label: "実績03 説明", name: "stat3_d", widget: "text" }
          - { label: "プロデューサー 引用文", name: "producer_quote", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "プロデューサー 本文", name: "producer_body", widget: "text" }
          - { label: "プロデューサー 英語名", name: "producer_name", widget: "string" }
          - { label: "プロデューサー 肩書き", name: "producer_title", widget: "string" }
          - { label: "会社名", name: "co_name", widget: "string" }
          - { label: "代表者", name: "co_ceo", widget: "string" }
          - { label: "設立", name: "co_established", widget: "string" }
          - { label: "資本金", name: "co_capital", widget: "string" }
          - { label: "事業内容", name: "co_business", widget: "string" }
          - { label: "免許番号", name: "co_license", widget: "string" }
          - { label: "総合オフィス 住所", name: "co_addr_main", widget: "string" }
          - { label: "本社 住所", name: "co_addr_hq", widget: "string" }
          - { label: "オフィス 住所", name: "co_addr_office", widget: "string" }
          - { label: "連絡先", name: "co_contact", widget: "string" }
          - { label: "営業時間", name: "co_hours", widget: "string" }
          - { label: "Webサイト", name: "co_web", widget: "string" }
          - { label: "フッター CTA 見出し", name: "cta_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }

      - name: "the-stump"
        label: "THE STUMP"
        file: "morio/data/the-stump.json"
        format: json
        fields:
          - { label: "エピグラフ 本文", name: "epi_text", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション01 ラベル", name: "s1_label", widget: "string" }
          - { label: "セクション01 見出し", name: "s1_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション01 本文1", name: "s1_p1", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション01 本文2", name: "s1_p2", widget: "text" }
          - { label: "セクション01 本文3", name: "s1_p3", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション02 ラベル", name: "s2_label", widget: "string" }
          - { label: "セクション02 見出し", name: "s2_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション02 本文1", name: "s2_p1", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション02 本文2", name: "s2_p2", widget: "text" }
          - { label: "セクション02 本文3", name: "s2_p3", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション03 ラベル", name: "s3_label", widget: "string" }
          - { label: "セクション03 見出し", name: "s3_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション03 本文1", name: "s3_p1", widget: "text" }
          - { label: "セクション03 本文2", name: "s3_p2", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション04 ラベル", name: "s4_label", widget: "string" }
          - { label: "セクション04 見出し", name: "s4_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション04 本文", name: "s4_p1", widget: "text" }
          - { label: "セクション05 ラベル", name: "s5_label", widget: "string" }
          - { label: "セクション05 見出し", name: "s5_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション05 本文1", name: "s5_p1", widget: "text" }
          - { label: "セクション05 本文2", name: "s5_p2", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション05 本文3", name: "s5_p3", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション06 ラベル", name: "s6_label", widget: "string" }
          - { label: "セクション06 見出し", name: "s6_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション06 本文1", name: "s6_p1", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション06 本文2", name: "s6_p2", widget: "text" }
          - { label: "パトロンフレーム アイラベル", name: "patron_eye", widget: "string" }
          - { label: "パトロンフレーム 本文", name: "patron_text", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
          - { label: "セクション07 ラベル", name: "s7_label", widget: "string" }
          - { label: "セクション07 見出し", name: "s7_heading", widget: "text", hint: "⚠️ HTMLタグを含みます。タグは削除・変更しないでください。" }
